[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "car-distance-prediction"
version = "0.1.0"
description = "ADAS prototype: vehicle segmentation, lane tracking and distance estimation"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
include = ["src*"]
